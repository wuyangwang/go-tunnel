name: CI + Release

# Trigger: push to master runs CI and, if CI passes, publishes a release.
# No pull_request trigger; no untrusted fork PRs can run this workflow.
on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: go build ./...

  test-race:
    name: test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector
        run: go test ./... -race -count=1

  release:
    name: release
    needs: [test, test-race]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./... -count=1

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          DIST=dist
          mkdir -p "$DIST"

          # Two binaries per platform: gotunnel-server + gotunnel-client.
          # Server targets Linux; client targets Windows; others provided.
          build() {
            local goos=$1 goarch=$2 ext=$3
            local out="$DIST/gotunnel_${goos}_${goarch}"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -trimpath -ldflags="-s -w" -o "$out/gotunnel-server$ext" ./cmd/server
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -trimpath -ldflags="-s -w" -o "$out/gotunnel-client$ext" ./cmd/client
          }

          build linux   amd64 ""
          build linux   arm64 ""
          build darwin  amd64 ""
          build darwin  arm64 ""
          build windows amd64 ".exe"
          build windows arm64 ".exe"

          # Package: zip for Windows, tar.gz otherwise.
          cd "$DIST"
          for dir in gotunnel_*/; do
            dir="${dir%/}"
            name="gotunnel_${VERSION}_${dir#gotunnel_}"
            cp ../README.md "$dir/README.md" 2>/dev/null || true
            if [[ "$dir" == *windows* ]]; then
              (cd "$dir" && zip -q -r "../$name.zip" .)
            else
              tar -czf "$name.tar.gz" -C "$dir" .
            fi
          done
          cd ..

          # Checksums.
          (cd "$DIST" && sha256sum *.tar.gz *.zip > SHA256SUMS)

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Auto-generated version tag on the current commit; no need to push a tag first.
          gh release create "$VERSION" \
            --target "${GITHUB_SHA}" \
            --title "$VERSION" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
