name: CI + Release

# Trigger: push to master runs CI and, if CI passes, publishes a release.
# No pull_request trigger; no untrusted fork PRs can run this workflow.
on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: go build ./...

  test-race:
    name: test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector
        run: go test ./... -race -count=1

  release-server:
    name: release server
    needs: [test, test-race]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./... -count=1

      - name: Build standalone server binaries
        shell: bash
        run: |
          set -euo pipefail
          VERSION="server-v0.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          DIST=dist
          mkdir -p "$DIST"

          # Raw standalone binary per platform, suffixed <os>_<arch>.
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64 .exe" "windows arm64 .exe"; do
            set -- $target
            goos=$1; goarch=$2; ext=${3:-}
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -trimpath -ldflags="-s -w" -o "$DIST/gotunnel-server_${goos}_${goarch}${ext}" ./cmd/server
          done

          (cd "$DIST" && sha256sum gotunnel-server* > SHA256SUMS)

      - name: Publish server Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --target "${GITHUB_SHA}" \
            --title "$VERSION" \
            --generate-notes \
            dist/gotunnel-server* dist/SHA256SUMS

  release-client:
    name: release client
    needs: [test, test-race]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./... -count=1

      - name: Build standalone client binaries
        shell: bash
        run: |
          set -euo pipefail
          VERSION="client-v0.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          DIST=dist
          mkdir -p "$DIST"

          # Raw standalone binary per platform, suffixed <os>_<arch>.
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64 .exe" "windows arm64 .exe"; do
            set -- $target
            goos=$1; goarch=$2; ext=${3:-}
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -trimpath -ldflags="-s -w" -o "$DIST/gotunnel-client_${goos}_${goarch}${ext}" ./cmd/client
          done

          (cd "$DIST" && sha256sum gotunnel-client* > SHA256SUMS)

      - name: Publish client Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --target "${GITHUB_SHA}" \
            --title "$VERSION" \
            --generate-notes \
            dist/gotunnel-client* dist/SHA256SUMS
